baseURL = 'https://example.com'
languageCode = 'zh-cn'
title = '我的朋友圈'
theme = 'tian'

[permalinks]
  posts = "/:filename.html"

[[menu.main]]
  name = "首页"
  url = "/"
  weight = 1

[[menu.main]]
  name = "关于"
  url = "/about.html"
  weight = 2

[[menu.main]]
  name = "友链"
  url = "/friends.html"
  weight = 3

[params]
  # ---------------------------------------------------------------------------------------
  # 个人信息设置
  # ---------------------------------------------------------------------------------------
  username = "您的名字"
  # 头像地址（可以放本地路径比如 "/images/avatar.jpg"，也可以放网图链接）
  avatar = "/images/avatar.jpg"
  
  # 个人简介，会显示在头像旁边
  description = "这是我的个人动态展示页"
  
  # 首页最上面那张大图
  # cover = "/images/header.png"
  
  # ---------------------------------------------------------------------------------------
  # 网站全局设置
  # ---------------------------------------------------------------------------------------
  favicon = "favicon.ico"
  
  # 页面最底部的文字，支持写 HTML 代码
  footerText = "© 2026 Designed by tian"

  # ICP 备案号，要是没有就注掉
  # icp = "京ICP备12345678号"
  
  # ---------------------------------------------------------------------------------------
  # 评论系统设置
  # ---------------------------------------------------------------------------------------
  # 评论模式：本主题（tian）默认用 "waline"（自托管 Waline，见下方第 0 项）；
  # 这个值是故意让上游自带的 artalk/twikoo 分支不命中的，评论统一走 Waline 注入。
  # 若想改回上游评论系统，可填 "artalk"、"twikoo"、"giscus"；填 "none" 则关掉评论。
  commentMode = "waline"

  # 0. Waline 评论（本主题默认；服务端部署见仓库 README 第 4 节）
  walineServer = "https://your-waline-server.com"
  # 可选：Cloudflare Turnstile 站点密钥（私钥配在 Waline 服务端的 TURNSTILE_SECRET）
  walineTurnstileKey = ""

  # 1. Artalk 评论（官方文档：https://artalk.js.org/）
  artalkServer = "https://your-artalk-server.com"
  artalkSite = "您的站点名称"
  # 是否开启底部评论弹幕（true 开启，false 关闭）
  enableDanmaku = true

  # 首页顶部封面：可以是图片或视频（用视频时把下一行换成视频路径）
  headerMedia = "/images/header.png"
  # headerMedia = "/videos/2792755201.mp4"
  
  # 2. Giscus 评论（官方文档：https://giscus.app/）
  # 如果上面填了 Artalk，会优先用 Artalk。两个都空着就不显示评论。
  giscusRepo = ""
  giscusRepoId = ""
  giscusCategory = ""
  giscusCategoryId = ""
  giscusMapping = "pathname"
  giscusStrict = "0"
  giscusReactionsEnabled = "1"
  giscusEmitMetadata = "0"
  giscusInputPosition = "bottom"
  giscusLang = "zh-CN"
  giscusLoading = "lazy"

  # 3. Twikoo 评论（后端 envId：腾讯云环境填 envId；Vercel/自建填地址）
  twikooEnvId = ""
  twikooLang = "zh-CN"
  
  # ---------------------------------------------------------------------------------------
  # 字体设置
  # ---------------------------------------------------------------------------------------
  # 现在支持这几种："ZQL", "PingFangQiaoMuTi", "AlimamaFangYuanTi"
  fontFamily = "ZQL"

  # ---------------------------------------------------------------------------------------
  # 功能开关
  # ---------------------------------------------------------------------------------------
  # PJAX 无刷新跳转：Waline 评论在 PJAX 下容易重复初始化，本主题默认关闭以保评论稳定
  enablePjax = false
  
  # 开启图片灯箱，点击图片可以放大看
  enableLightbox = true
  
  # ---------------------------------------------------------------------------------------
  # 社交链接（想加几个加几个）
  # ---------------------------------------------------------------------------------------
  # [[params.social]]
  #   name = "GitHub"
  #   icon = "ri-github-line" # 这里填 RemixIcon 的类名
  #   url = "https://github.com/"

[markup]
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = true
    lineNumbersInTable = false
    noClasses = true
    style = "dracula"
    tabWidth = 4
